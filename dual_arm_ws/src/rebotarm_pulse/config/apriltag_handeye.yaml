/**:
  ros__parameters:
    image_transport: raw
    family: 36h11
    size: 0.040
    max_hamming: 0
    qos_profile: sensor_data
    detector:
      threads: 2
      decimate: 1.0
      blur: 0.0
      refine: true
      sharpening: 0.25
      debug: false
    pose_estimation_method: pnp

piperh_auto_handeye:
  ros__parameters:
    record_only: false
    # local: Train/Selection/Test all require observed board tilt <25 deg and
    # camera depth <0.48 m. global: preserve the full position/orientation pool.
    calibration_workspace_mode: local
    # FK candidates are returned in the live namespaced TF base.
    moveit_base_frame: piperh/base_link
    moveit_link_name: Link5
    min_detection_interval: 0.15
    max_detection_age: 0.25
    # If the camera stamp is slightly ahead of ROS time, wait for that exact
    # stamp before applying the normal age, joint-state and TF synchronization gates.
    max_future_timestamp_wait_sec: 0.5
    robot_tf_wait_sec: 0.1
    robot_visual_sync_threshold: 0.05
    joint_history_size: 1000
    joint_candidate_pool_size: 768
    # J6 is locked for the complete Link5 calibration. Keep a fixed 0.1 rad
    # distance from the official +/-2.0943951 rad hard limits instead of the
    # J1-J5 percentage margin, which rejected the validated -1.93515 rad mount.
    locked_j6_margin_rad: 0.10
    # Avoid Piper-H J4's observed near-zero no-motion region. Candidate goals
    # and the actual MoveIt trajectory endpoint are both checked.
    j4_zero_exclusion_deg: 0.30
    observation_queue_size: 100
    vision_frame_timeout: 10.0
    anchor_translation_threshold: 0.0011
    anchor_rotation_threshold: 0.25
    anchor_goal_tolerance_rad: 0.0005
    motion_stop_timeout: 1.5
    # Formal calibration arrival gate; never changes controller/global tolerances.
    joint_arrival_tolerance_deg: 0.11
    stable_duration: 1.0
    stable_position_variation_deg: 0.01
    arrival_timeout_sec: 10.0
    # Bootstrap-only MoveIt planning and trajectory-scaling settings.
    # Controller completion tolerance remains independent; CAN arrival is authoritative.
    bootstrap_goal_tolerance_rad: 0.0005
    bootstrap_velocity_scaling: 0.4
    bootstrap_acceleration_scaling: 0.25
    bootstrap_convergence_retries: 1
    # Pre-register 20 disjoint Test poses; no replacement after observing results.
    test_samples: 20
    minimum_valid_test_samples: 16
    # Preserve the two-consecutive-round convergence gate while leaving room
    # for two full adaptive batches after a late solver change near 64 samples.
    maximum_calibration_samples: 80
    # Area fraction of measured-corner hull; RMS in pixels.
    quality_min_board_area: 0.01
    quality_max_reprojection_error: 3.0
    # 12 * sqrt(det(covariance of [u/width, v/height])).
    quality_min_corner_distribution: 0.005
    quality_reprojection_epsilon: 0.1
    quality_area_weight: 0.4
    quality_reprojection_weight: 0.03
    quality_distribution_weight: 0.3
