pulse_approach:
  ros__parameters:
    group_name: arm
    joint_names: [joint1, joint2, joint3, joint4, joint5, joint6]
    base_frame: base_link
    tcp_link: gripper_tcp
    target_topic: /meridian_hand_vision/pulse_point
    calibration_name: rebotarm_camera
    standoff_m: 0.060
    probe_tip_offset_m: 0.0
    workspace_limits: [0.10, 0.65, -0.45, 0.45, -0.05, 0.55]
    target_timeout_sec: 6.0
    maximum_target_age_sec: 0.5
    tf_timeout_sec: 2.0
    planning_time: 5.0
    planning_attempts: 5
    ik_timeout: 5.0
    planner_id: RRTConnect
    pipeline_id: ompl
    result_timeout: 30.0
    joint_tolerance: 0.01
    velocity_scaling: 0.05
    acceleration_scaling: 0.05
    preview_delay_sec: 2.0
