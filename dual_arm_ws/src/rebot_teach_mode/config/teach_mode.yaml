rebot_teach_mode:
  ros__parameters:
    arm_namespace: rebotarm
    # The node loads and validates trajectories with false, but every operation
    # capable of changing real hardware is rejected until launch explicitly
    # overrides this field.
    allow_hardware: false
    joint_names: [joint1, joint2, joint3, joint4, joint5, joint6]
    trajectory_path: motions/rs/teach/latest.motion.json
    action_library_dir: motions/rs/action_groups
    robot_model: rebotarm_rs
    sample_period_sec: 0.02
    minimum_position_delta_rad: 0.0005
    minimum_recording_duration_sec: 0.5
    minimum_recording_points: 5
    maximum_recording_duration_sec: 120.0
    maximum_samples: 6000
    feedback_timeout_sec: 0.30
    status_timeout_sec: 0.50
    driver_service_timeout_sec: 5.0
    # RViz-only smoothing. Long stationary holds are compressed and the
    # display path is interpolated at 50 Hz; saved/replayed hardware data is unchanged.
    preview_frame_period_sec: 0.02
    preview_maximum_idle_sec: 0.20
    preview_idle_position_delta_rad: 0.002
    require_xbox_locked: true
    endpoint_tolerance_rad: 0.08
    replay_speed_scale: 1.0
    maximum_joint_velocity_rad_s: 0.30
    reverse_return: true
    start_dwell_sec: 0.5
    # Before sequence preview or real playback, MoveIt plans every disconnected
    # action boundary. The collision-checked path replaces RViz pose jumps and
    # the old hardware behavior of retracing the next action backwards.
    sequence_transition_direct_tolerance_rad: 0.01
    sequence_transition_planning_time_sec: 5.0
    sequence_transition_service_timeout_sec: 15.0
    sequence_transition_velocity_scaling_factor: 0.1
    maximum_tracking_error_rad: 0.25
    tracking_error_consecutive_samples: 5
    # RS standalone defaults. teach_mode.launch.py replaces the model, storage
    # paths, and limits together when model:=dm is selected.
    joint_lower_limits: [-2.8, 0.0, 0.0, -1.57, -1.57, -3.14]
    joint_upper_limits: [2.8, 3.14, 3.14, 1.57, 1.57, 3.14]
    joint_limit_margin_rad: 0.0
    tcp_base_frame: base_link
    tcp_link_name: gripper_tcp
    shape_center: [0.28, 0.0, 0.12]
    shape_width: 0.06
    shape_height: 0.08
    # The physical pen extends along gripper_tcp +X, which maps to drawing-frame
    # local -Z. Local +Z is the pen-up direction towards the arm.
    shape_tcp_rpy: [0.0, 1.57, 0.0]
    shape_tcp_yaw_offsets: [0.0, 3.141592653589793, -3.141592653589793]
    shape_cartesian_step_m: 0.003
    shape_jump_threshold: 0.0
    shape_planning_time_sec: 5.0
    shape_service_timeout_sec: 15.0
    shape_maximum_joint_velocity_rad_s: 0.15
    shape_maximum_start_drift_rad: 0.02
    shape_marker_scale_m: 0.09
    # Pen length exposed beyond the physical gripper front. The model profile
    # adds the measured gripper_tcp-to-front mount offset automatically.
    shape_pen_length_m: 0.0
    shape_pen_mount_offset_m: 0.0
    # Before/after drawing and between disconnected strokes, the tip moves this
    # far in local +Z (towards the arm) so blank regions are not marked.
    shape_pen_lift_m: 0.012
    # Explicit, user-triggered pen-tip reachability preflight. A failed point
    # is retried without collision checking to distinguish collision from no IK.
    shape_preflight_maximum_points: 60
    shape_preflight_joint_warning_margin_rad: 0.15
    shape_preflight_ik_timeout_sec: 0.08
    shape_preflight_suggestion_step_m: 0.02
    shape_preflight_suggestion_steps: 3
    # Keep image-derived paths concise enough for interactive MoveIt planning.
    image_maximum_strokes: 24
    image_maximum_points: 480
    image_minimum_contour_length_px: 24.0
    image_simplify_epsilon_px: 2.0
    tcp_trace_line_width_m: 0.004

rebot_teach_xbox_bridge:
  ros__parameters:
    arm_namespace: rebotarm
    joy_topic: /joy
    armed_topic: /rebot_xbox/armed
    control_target_topic: /xbox/control_target
    teach_status_topic: /rebotarm/teach/status
    record_button: 2   # X, hold to record
    replay_button: 1   # B, press to replay
    cancel_button: 7   # Start; software cancel only
    joy_timeout_sec: 0.30
