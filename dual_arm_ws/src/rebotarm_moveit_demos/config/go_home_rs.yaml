go_home:
  ros__parameters:
    group_name: arm
    joint_names:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    # Must match the RS "home" group_state in rebotarm_rs.srdf.
    home_joint_values: [0.0, 1.75, 0.7, -0.7, 0.0, 0.0]
    planning_time: 8.0
    planner_id: RRTConnect
    pipeline_id: ompl
    joint_tolerance: 0.005
    velocity_scaling: 0.05
    acceleration_scaling: 0.05
    result_timeout: 60.0
