phase4b_capture_node:
  ros__parameters:
    use_sim_time: true
    color_topic: /antbot/camera/color/image_raw
    depth_topic: /antbot/camera/depth/image_raw
    camera_info_topic: /antbot/camera/color/camera_info
    pose_mode: tf
    pose_source: ground_truth
    pose_topic: /camera/pose
    pose_message_type: odometry
    pose_topic_child_frame: camera_color_optical_frame
    world_frame: odom
    camera_frame: camera_color_optical_frame
    output_root: artifacts/rgbd_datasets
    dataset_name: sim_rgbd_tsdf_01
    overwrite_existing: false
    minimum_free_space_gb: 2.0
    robot_id: antbot_sim
    sensor_id: front_rgbd
    depth_encoding_mode: auto
    depth_scale_override: 1.0
    depth_aligned_to_color: true
    require_rectified_color: true
    depth_min: 0.20
    depth_max: 8.0
    minimum_valid_depth_ratio: 0.90
    max_rgb_depth_delta_ms: 30.0
    max_pose_delta_ms: 30.0
    sync_queue_size: 30
    pose_queue_size: 100
    tf_timeout_s: 0.10
    tf_cache_s: 60.0
    translation_threshold_m: 0.025
    rotation_threshold_deg: 2.0
    min_keyframe_interval_s: 0.15
    max_keyframe_interval_s: 0.40
    max_translation_jump_m: 0.50
    max_rotation_jump_deg: 30.0
    max_linear_speed_mps: 1.0
    max_angular_speed_deg_s: 90.0
    live_preview_enabled: true
    preview_voxel_size_m: 0.03
    coverage_voxel_size_m: 0.20
    preview_pixel_stride: 2
    preview_max_rate_hz: 4.0
    coverage_growth_window_s: 10.0
    target_keyframes: 150
    minimum_direction_keyframes: 5
    stop_growth_percent: 1.0
    preview_output_path: ""
    preview_output_frame: ""
