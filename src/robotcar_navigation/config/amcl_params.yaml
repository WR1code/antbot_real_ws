amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    max_beams: 120
    min_particles: 500
    max_particles: 2000
    transform_tolerance: 1.0
    update_min_d: 0.05
    update_min_a: 0.1
    alpha1: 0.1
    alpha2: 0.25
    alpha3: 0.1
    alpha4: 0.25
    alpha5: 0.05
