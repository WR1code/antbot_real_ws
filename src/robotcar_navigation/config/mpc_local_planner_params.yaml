# ROS 2 Jazzy/Nav2 MPPI controller fragment. The main launch uses nav2_params.yaml.
controller_server:
  ros__parameters:
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      motion_model: DiffDrive
      vx_max: 0.5
      vx_min: -0.2
      wz_max: 1.2
      ax_max: 0.8
      ax_min: -0.8
      az_max: 1.5
      model_dt: 0.05
      time_steps: 40
      batch_size: 1000
